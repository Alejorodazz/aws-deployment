name: Deploy Production Infrastructure

on:
  pull_request:
    paths:
      - ".github/workflows/deploy-env-production.yml"
      - "infraestructure/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/deploy-env-production.yml"
      - "infraestructure/**"

permissions:
  contents: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: infraestructure/environments/production
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: infraestructure/environments/production
        run: terraform validate -no-color

  deploy:
    name: Plan and Apply Production
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: infraestructure/environments/production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Verify remote state migration
        env:
          PRODUCTION_STATE_READY: ${{ vars.PRODUCTION_STATE_READY }}
        run: |
          test "$PRODUCTION_STATE_READY" = "true" || {
            echo "Set the production environment variable PRODUCTION_STATE_READY=true after migrating the local state to S3."
            exit 1
          }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Materialize production variables
        env:
          PRODUCTION_TFVARS: ${{ secrets.PRODUCTION_TFVARS }}
        run: |
          test -n "$PRODUCTION_TFVARS" || {
            echo "Missing required PRODUCTION_TFVARS environment secret."
            exit 1
          }
          printf '%s\n' "$PRODUCTION_TFVARS" > prod.tfvars

      - name: Terraform Init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
        run: |
          test -n "$TF_STATE_BUCKET" || {
            echo "Missing required TF_STATE_BUCKET environment secret."
            exit 1
          }
          test -n "$TF_STATE_LOCK_TABLE" || {
            echo "Missing required TF_STATE_LOCK_TABLE environment secret."
            exit 1
          }
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=$TF_STATE_LOCK_TABLE" \
            -backend-config="encrypt=true"

      - name: Terraform Plan
        run: terraform plan -var-file=prod.tfvars -input=false -lock-timeout=5m -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
